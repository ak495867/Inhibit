[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inhibit"
version = "0.1.0"
description = "Leakage-safe adaptive factor discovery and tail-risk-aware execution research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Inhibit Contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "pyarrow>=15.0"]
research = ["scipy>=1.12", "statsmodels>=0.14"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
all = ["yfinance>=0.2.40", "pyarrow>=15.0", "scipy>=1.12", "statsmodels>=0.14", "pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
inhibit = "inhibit.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
